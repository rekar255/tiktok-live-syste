<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>داشبۆردی کۆنتڕۆڵی ٤ ئەکاونتی لایڤ</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: #0f172a; color: #e2e8f0; padding: 16px; }
    .container { max-width: 900px; margin: 0 auto; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 16px; }
    h1, h2 { margin: 0 0 12px; font-size: 18px; color: #f8fafc; }
    .row { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    input, select, button {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid #475569;
      background: #0f172a; color: #f8fafc; font-size: 14px;
    }
    button { cursor: pointer; font-weight: 600; border: none; transition: 0.2s; }
    .btn-primary { background: #2563eb; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; }
    .btn-success:hover { background: #15803d; }
    .btn-danger { background: #dc2626; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 999px; font-size: 12px; background: #334155; }
    .ok { background: #14532d; color: #86efac; }
    .err { background: #7f1d1d; color: #fca5a5; }
    .accounts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
    .acc-box { background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; }
    .acc-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .log-box {
      background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 12px;
      height: 220px; overflow-y: auto; font-family: monospace; font-size: 12px; direction: ltr; text-align: left;
    }
    .log-line { margin-bottom: 6px; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h1>داشبۆردی لایککردنی لایڤ (٤ ئەکاونت)</h1>
        <span id="wsStatus" class="status-badge err">Disconnected</span>
      </div>

      <div class="row">
        <div>
          <label>لینکی لایڤی تیکتۆک</label>
          <input id="liveUrl" type="url" placeholder="https://www.tiktok.com/@username/live" />
        </div>
        <div>
          <label>ژمارەی لایک بۆ هەر ئەکاونتێک</label>
          <input id="likesCount" type="number" min="1" max="500" value="25" />
        </div>
        <div>
          <label>کاتی نێوان لایکەکان (بە چرکە)</label>
          <input id="delaySec" type="number" min="1" max="60" value="3" />
        </div>
      </div>

      <div class="btn-group">
        <button class="btn-success" onclick="startLikes()">دەستپێکردنی لایککردن</button>
        <button class="btn-danger" onclick="stopLikes()">وەستاندنی هەمووی</button>
      </div>
    </div>

    <div class="card">
      <h2>دۆخی ٤ ئەکاونتەکە</h2>
      <div class="accounts-grid" id="accountsGrid"></div>
    </div>

    <div class="card">
      <h2>تۆماری چالاکییەکان (Log)</h2>
      <div class="log-box" id="logBox"></div>
    </div>
  </div>

  <script>
    const accounts = [
      { id: 'acc_1', label: 'ئەکاونتی ١', enabled: true, state: 'Idle', sent: 0 },
      { id: 'acc_2', label: 'ئەکاونتی ٢', enabled: true, state: 'Idle', sent: 0 },
      { id: 'acc_3', label: 'ئەکاونتی ٣', enabled: true, state: 'Idle', sent: 0 },
      { id: 'acc_4', label: 'ئەکاونتی ٤', enabled: true, state: 'Idle', sent: 0 }
    ];

    let ws;
    const logBox = document.getElementById('logBox');
    const wsStatus = document.getElementById('wsStatus');

    function addLog(msg) {
      const time = new Date().toLocaleTimeString();
      const div = document.createElement('div');
      div.className = 'log-line';
      div.textContent = `[${time}] ${msg}`;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function renderAccounts() {
      const grid = document.getElementById('accountsGrid');
      grid.innerHTML = '';
      accounts.forEach((acc, idx) => {
        const box = document.createElement('div');
        box.className = 'acc-box';
        box.innerHTML = `
          <div class="acc-header">
            <strong>${acc.label}</strong>
            <input type="checkbox" style="width:auto;" ${acc.enabled ? 'checked' : ''} onchange="toggleAcc(${idx}, this.checked)" />
          </div>
          <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">دۆخ: <span id="state_${acc.id}">${acc.state}</span></div>
          <div style="font-size:12px; color:#94a3b8;">نێردراو: <span id="sent_${acc.id}">${acc.sent}</span></div>
        `;
        grid.appendChild(box);
      });
    }

    function toggleAcc(idx, val) {
      accounts[idx].enabled = val;
      addLog(`${accounts[idx].label} ${val ? 'چالاک کرا' : 'ناچالاک کرا'}`);
    }

    function connectWS() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}`);

      ws.onopen = () => {
        wsStatus.textContent = 'Connected';
        wsStatus.className = 'status-badge ok';
        addLog('WebSocket connected');
      };

      ws.onmessage = (event) => {
        addLog(`Server: ${event.data}`);
        try {
          const msg = JSON.parse(event.data);
          if (msg.accountId) {
            const acc = accounts.find(a => a.id === msg.accountId);
            if (acc) {
              if (msg.state) acc.state = msg.state;
              if (typeof msg.sent === 'number') acc.sent = msg.sent;
              renderAccounts();
            }
          }
        } catch (_) {}
      };

      ws.onclose = () => {
        wsStatus.textContent = 'Disconnected';
        wsStatus.className = 'status-badge err';
        addLog('WebSocket disconnected. Reconnecting in 3s...');
        setTimeout(connectWS, 3000);
      };
    }

    function startLikes() {
      const liveUrl = document.getElementById('liveUrl').value.trim();
      const count = Number(document.getElementById('likesCount').value) || 10;
      const delaySec = Number(document.getElementById('delaySec').value) || 3;

      if (!liveUrl) {
        alert('تکایە لینکی لایڤ بنووسە');
        return;
      }

      const activeAccounts = accounts.filter(a => a.enabled).map(a => a.id);
      if (activeAccounts.length === 0) {
        alert('هیچ ئەکاونتێک چالاک نییە');
        return;
      }

      const command = {
        type: 'command',
        action: 'start_live_likes',
        payload: {
          liveUrl,
          accounts: activeAccounts,
          likesPerAccount: count,
          delayMs: delaySec * 1000,
          staggerMs: 2500 // دەستپێکردنی ئەکاونتەکان بە جیاوازی ٢.٥ چرکە
        }
      };

      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify(command));
        addLog(`Sent start_live_likes for ${activeAccounts.length} account(s)`);
      } else {
        addLog('Error: WebSocket is not connected');
      }
    }

    function stopLikes() {
      if (ws && ws.readyState === WebSocket.OPEN) {
        ws.send(JSON.stringify({
          type: 'command',
          action: 'stop_live_likes',
          payload: {}
        }));
        addLog('Sent stop_live_likes');
      }
    }

    renderAccounts();
    connectWS();
  </script>
</body>
</html>
